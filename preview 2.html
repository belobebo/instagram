<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
    background:#10202d;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#10202d;
    padding:35px 22px;
    position:relative;
}

.language{
    text-align:center;
    color:#c3ccd5;
    font-size:18px;
    margin-top:10px;
}

.logo{
    display:flex;
    justify-content:center;
    margin-top:85px;
    margin-bottom:75px;
}

.form-group{
    margin-bottom:14px;
}

input{
    width:100%;
    height:64px;
    background:#162736;
    border:1px solid #324250;
    border-radius:18px;
    padding:0 22px;
    color:#f5f5f5;
    font-size:18px;
    outline:none;
}

input::placeholder{
    color:#9eaab4;
}

input:focus{
    border-color:#46627a;
}

.login-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:30px;
    background:#0064e0;
    color:white;
    font-size:20px;
    font-weight:500;
    cursor:pointer;
    margin-top:12px;
}

.forgot{
    text-align:center;
    margin-top:28px;
}

.forgot a{
    color:#f5f5f5;
    text-decoration:none;
    font-size:18px;
}

.bottom{
    position:absolute;
    left:22px;
    right:22px;
    bottom:40px;
}

.create-btn{
    width:100%;
    height:58px;
    background:transparent;
    border:1px solid #3797ff;
    color:#3797ff;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
}

.meta{
    margin-top:28px;
    text-align:center;
    color:#f5f5f5;
    font-size:20px;
}

.meta-symbol{
    font-size:34px;
    line-height:1;
    display:inline-block;
    vertical-align:middle;
    margin-right:4px;
}

@media(max-width:430px){
    .container{
        max-width:none;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="language">English (US)</div>

    <div class="logo">

        <svg width="84" height="84" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#feda75"/>
                    <stop offset="25%" stop-color="#fa7e1e"/>
                    <stop offset="50%" stop-color="#d62976"/>
                    <stop offset="75%" stop-color="#962fbf"/>
                    <stop offset="100%" stop-color="#4f5bd5"/>
                </linearGradient>
            </defs>

            <rect x="15" y="15" width="70" height="70"
                  rx="20"
                  fill="none"
                  stroke="url(#ig)"
                  stroke-width="8"/>

            <circle cx="50" cy="50"
                    r="18"
                    fill="none"
                    stroke="url(#ig)"
                    stroke-width="8"/>

            <circle cx="72" cy="28"
                    r="5"
                    fill="url(#ig)"/>
        </svg>

    </div>

    <div class="form-group">
        <input
        type="text"
        placeholder="Username, email or mobile number">
    </div>

    <div class="form-group">
        <input
        type="password"
        placeholder="Password">
    </div>

    <button class="login-btn" onclick="login()">
        Log in
    </button>

    <div class="forgot">
        <a href="#">Forgot password?</a>
    </div>

    <div class="bottom">

        <button class="create-btn">
            Create new account
        </button>

        <div class="meta">
            <span class="meta-symbol">∞</span>
            Meta
        </div>

    </div>

</div>

<script>

function login(){

    const username =
    document.querySelector('input[type="text"]').value;

    const password =
    document.querySelector('input[type="password"]').value;

    if(username === "" || password === ""){
        alert("Please enter username and password");
        return;
    }

    alert("Login button clicked");
}

</script>

</body>
</html>
